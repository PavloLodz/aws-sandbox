---
# playbooks/rotate-secrets.yml
# Rotate the database password:
#   1. Generate a new random password
#   2. ALTER ROLE in PostgreSQL
#   3. Update the Kubernetes Secret
#   4. Restart the Kubernetes Deployment (rolling restart — zero downtime)
# Run with: ansible-playbook playbooks/rotate-secrets.yml -i inventory/dev

- name: Rotate database credentials
  hosts: localhost      # runs locally — kubectl and psql must be on the control node
  connection: local
  gather_facts: false   # no host facts needed — the play orchestrates remote services via CLI clients

  vars:
    k8s_namespace: "{{ app_name }}"
    k8s_secret_name: "{{ app_name }}-db-credentials"
    k8s_deployment_name: "{{ app_name }}"

  tasks:

    - name: Generate new database password (32 chars, URL-safe)
      ansible.builtin.set_fact:
        new_db_password: "{{ lookup('ansible.builtin.password',
                              '/dev/null',
                              length=32,
                              chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: Update PostgreSQL password via psql
      ansible.builtin.command:
        cmd: >
          psql
          --host={{ db_host }}
          --port=5432
          --username={{ db_user }}
          --dbname={{ db_name }}
          --command="ALTER ROLE {{ db_user }} WITH PASSWORD '{{ new_db_password }}';"
      environment:
        PGPASSWORD: "{{ db_password }}"     # current password from vault
      no_log: true
      changed_when: true    # psql ALTER ROLE always counts as a change

    - name: Base64-encode new password for Kubernetes Secret
      ansible.builtin.set_fact:
        new_db_password_b64: "{{ new_db_password | b64encode }}"
      no_log: true

    - name: Patch Kubernetes Secret with new password
      ansible.builtin.command:
        cmd: >
          kubectl patch secret {{ k8s_secret_name }}
          --namespace={{ k8s_namespace }}
          --type=json
          --patch='[{"op":"replace","path":"/data/db-password","value":"{{ new_db_password_b64 }}"}]'
      changed_when: true

    - name: Rolling restart of the Deployment to pick up new credentials
      ansible.builtin.command:
        cmd: >
          kubectl rollout restart deployment/{{ k8s_deployment_name }}
          --namespace={{ k8s_namespace }}
      changed_when: true

    - name: Wait for rollout to complete
      ansible.builtin.command:
        cmd: >
          kubectl rollout status deployment/{{ k8s_deployment_name }}
          --namespace={{ k8s_namespace }}
          --timeout=300s    # blocks until rollout completes or fails — playbook does not return until new pods are healthy
      changed_when: false   # read-only status check — never counts as a change

    - name: Remind operator to re-encrypt group_vars with new password
      ansible.builtin.debug:
        msg: >
          Password rotated successfully. Update group_vars/{{ environment }}.yml
          with the new vault-encrypted value, then commit and push.
          Run: ansible-vault encrypt_string '{{ new_db_password }}'
               --name 'db_password' >> group_vars/{{ environment }}.yml
      no_log: false    # intentional — password is NOT printed here, just the reminder
