---
# playbooks/hardening.yml
# OS security baseline: SSH hardening, firewall, fail2ban, audit logging.
# Run with: make ansible-harden
#           ansible-playbook playbooks/hardening.yml -i inventory/dev

- name: OS Security Baseline
  hosts: all
  become: true

  tasks:

    # ── SSH hardening ─────────────────────────────────────────────────────────
    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
        validate: 'sshd -t -f %s'    # validates config before writing — prevents SSH lockout from a bad change
      notify: Restart sshd

    - name: Disable password authentication (key-only SSH)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: Allow Ansible pipelining (requiretty disabled for ansible user)
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/ansible-pipelining
        line: 'Defaults !requiretty'
        create: true
        mode: "0440"
        validate: 'visudo -cf %s'    # validates sudoers syntax before writing — an invalid sudoers file can permanently break privilege escalation

    # ── ufw firewall ──────────────────────────────────────────────────────────
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Set ufw default policy — deny incoming
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Set ufw default policy — allow outgoing
      community.general.ufw:
        default: allow
        direction: outgoing

    - name: Allow SSH (port 22)
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow application port (8080)
      community.general.ufw:
        rule: allow
        port: "8080"
        proto: tcp

    - name: Allow Prometheus node exporter (9090)
      community.general.ufw:
        rule: allow
        port: "9090"
        proto: tcp

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    # ── fail2ban ──────────────────────────────────────────────────────────────
    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present

    - name: Configure fail2ban SSH jail
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.conf
        content: |
          [sshd]
          enabled  = true
          port     = ssh
          filter   = sshd
          logpath  = /var/log/auth.log
          maxretry = 5
          bantime  = 3600
        mode: "0644"
      notify: Restart fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    # ── Audit logging ─────────────────────────────────────────────────────────
    - name: Set HISTTIMEFORMAT for audit logging (all users)
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: '^HISTTIMEFORMAT='
        line: 'HISTTIMEFORMAT="%F %T  "'
        state: present

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
