---
# inventory/staging/hosts.yml — staging host group. IPs are placeholders; update from Terraform output.

all:
  children:
    staging:
      hosts:
        staging-app-01:
          ansible_host: 10.1.10.10                            # replace with real private IP from Terraform staging output
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/myapp-staging.pem

# To retrieve the real IP from Terraform after terraform apply, run:
#   terraform -chdir=infrastructure/terraform/environments/staging output node_private_ips
