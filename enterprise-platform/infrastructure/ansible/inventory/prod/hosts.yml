---
# inventory/prod/hosts.yml — prod host group. IPs are placeholders; update from Terraform output. StrictHostKeyChecking enforced.

all:
  children:
    prod:
      hosts:
        prod-app-01:
          ansible_host: 10.2.10.10                          # replace with real private IP from Terraform prod output
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/myapp-prod.pem
          ansible_ssh_common_args: '-o StrictHostKeyChecking=yes'  # overrides host_key_checking = False from ansible.cfg for prod hosts only

# To retrieve the real IP from Terraform after terraform apply, run:
#   terraform -chdir=infrastructure/terraform/environments/prod output node_private_ips
