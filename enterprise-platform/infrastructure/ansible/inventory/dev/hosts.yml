---
# inventory/dev/hosts.yml — dev host group. IPs are placeholders; update from Terraform output after terraform apply.

all:
  children:
    dev:
      hosts:
        dev-app-01:
          ansible_host: 10.0.10.10                        # replace with real private IP from Terraform output
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/myapp-dev.pem  # never commit private keys; chmod 400 required

# To retrieve the real IP from Terraform after terraform apply, run:
#   terraform -chdir=infrastructure/terraform/environments/dev output node_private_ips
