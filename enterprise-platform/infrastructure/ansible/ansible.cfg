# infrastructure/ansible/ansible.cfg
#
# Project-level Ansible configuration.
# This file is read automatically when ansible-playbook is run from inside
# infrastructure/ansible/ or when ANSIBLE_CONFIG is set to its path:
#   export ANSIBLE_CONFIG=/path/to/infrastructure/ansible/ansible.cfg
#
# Sections:
#   [defaults]             — inventory path, roles path, output format, vault
#   [privilege_escalation] — sudo become settings for all plays
#   [ssh_connection]       — pipelining to reduce SSH round-trips

[defaults]
inventory           = inventory/       # Ansible finds host groups relative to this file
roles_path          = roles/           # role lookups resolve relative to the project root
host_key_checking   = False            # disable for CI; enable for production
retry_files_enabled = False            # suppress .retry files from cluttering the repo
stdout_callback     = yaml             # human-readable output instead of the default
interpreter_python  = auto_silent      # suppress Python deprecation warnings

# reads vault password from ANSIBLE_VAULT_PASSWORD env var (see vault-password-client.sh)
vault_password_file = vault-password-client.sh

[privilege_escalation]
become        = True   # default become: true for all plays
become_method = sudo

[ssh_connection]
# pipelining = True speeds up play execution significantly by reusing SSH connections
# rather than opening a new connection per task module transfer.
# Requires: Defaults !requiretty in the remote sudoers file (added by hardening.yml).
pipelining = True      # reduces SSH round-trips; requires requiretty=False in sudoers
