# Production Kubernetes overrides — apply with:
#   helm upgrade --install myapp . -f values-k8s.yaml

replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

image:
  pullPolicy: IfNotPresent

config:
  springProfile: docker
  loggingLevel: WARN

ingress:
  enabled: true
  host: myapp.example.com
  className: nginx
  rewriteTarget: /

hpa:
  minReplicas: 3
  maxReplicas: 10
  cpuUtilizationPercentage: 60

monitoring:
  enabled: true
  namespace: monitoring
