# Test-local profile — used by AbstractLocalIT (Testcontainers + LocalStack).
# Real values are injected dynamically via @DynamicPropertySource;
# these are safe fallback defaults so Spring context starts without complaints.
aws.s3.region=us-east-1
aws.s3.bucket=test-bucket
# aws.s3.endpoint-override  → set dynamically from LocalStack container URL
# aws.s3.access-key         → set dynamically from LocalStack container
# aws.s3.secret-key         → set dynamically from LocalStack container
