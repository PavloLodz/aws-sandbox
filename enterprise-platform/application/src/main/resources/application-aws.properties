# AWS profile - datasource is provided via environment variables
# These are automatically set by:
#   - Elastic Beanstalk: RDS_ prefix vars when an RDS instance is attached
#   - ECS/EKS:           Inject via task definition / K8s secrets
#   - Lambda:            Environment variables in function config
#
# Override names to match what your AWS service injects, or set
# RDS_HOSTNAME / RDS_PORT / RDS_DB_NAME / RDS_USERNAME / RDS_PASSWORD directly.

spring.datasource.url=jdbc:postgresql://${RDS_HOSTNAME}:${RDS_PORT}/${RDS_DB_NAME}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}

# Connection pool tuning for RDS
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# S3
aws.s3.bucket=${S3_BUCKET}
aws.s3.region=${S3_REGION:eu-central-1}

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
