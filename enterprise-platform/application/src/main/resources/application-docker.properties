# Docker Compose profile
# Activated automatically when the app runs inside the compose stack.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:aws_attempt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true

# S3 — in local Docker Compose this points at LocalStack (see docker-compose.yml).
# In production (AWS profile) these are overridden by application-aws.properties.
aws.s3.bucket=${S3_BUCKET:local-bucket}
aws.s3.region=${S3_REGION:us-east-1}
# Optional: set by docker-compose to point at LocalStack; absent in production.
aws.s3.endpoint-override=${S3_ENDPOINT_OVERRIDE:#{null}}
aws.s3.access-key=${S3_ACCESS_KEY:#{null}}
aws.s3.secret-key=${S3_SECRET_KEY:#{null}}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
