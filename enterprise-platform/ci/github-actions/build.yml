# ci/github-actions/build.yml
#
# Implements R7.1: run all tests, build the container image, and push it to
# the registry on every push to main and every pull request.
#
# Stage sequence (single job, linear — enforces R7.8):
#   checkout → setup-java (Maven cache) → mvn verify → compute tag →
#   setup-buildx → registry login → docker build+push → build summary
#
# The Docker build step is unreachable unless mvn verify exits 0.
# A failing test terminates the job before the image is ever built or pushed.

name: Build

on:
  push:
    branches: [ main ]
  pull_request:

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  IMAGE_NAME: myapp

jobs:
  test-and-build:
    name: Test, Build & Push
    runs-on: ubuntu-latest
    # ubuntu-latest ships with Docker pre-installed — required both for
    # Testcontainers integration tests and for the docker/build-push-action step.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          # Caches ~/.m2/repository keyed on pom.xml hash.
          # Saves 60–90 s per run on a warm cache (~200 MB of deps).

      - name: Run tests (mvn verify)
        working-directory: application
        run: mvn verify --batch-mode
        # mvn verify: compile → test (surefire) → package → verify (failsafe).
        # Testcontainers integration tests start Docker containers on the runner —
        # Docker availability on ubuntu-latest is therefore a hard requirement.
        # --batch-mode suppresses interactive progress bars for clean CI logs.
        # R7.8: the Docker build step below is only reached when this exits 0.

      - name: Compute image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        # 7-char short SHA — unique per commit, traceable to source, and safe
        # for use in Kubernetes labels (63-char limit, alphanumeric + hyphen).
        # Never use 'latest' in k8s manifests; every deployed image must be
        # traceable to an exact commit.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          # All credentials sourced from GitHub Secrets — never hardcoded (R7.9).

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: application
          file: application/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # PRs: image is built (validates Dockerfile) but not pushed — avoids
          # polluting the shared registry with unreviewed images.
          # Pushes to main: build + push with SHA tag.
          tags: ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit GitHub Actions cache — reuses unchanged layers across runs,
          # cutting build time significantly when only source files change.

      - name: Post build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag    | \`${{ steps.tag.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry     | \`${{ secrets.REGISTRY_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit       | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

# ── Required GitHub Secrets ──────────────────────────────────────────────────
# REGISTRY_URL      — container registry hostname (e.g. ghcr.io/org)
# REGISTRY_USERNAME — registry login username
# REGISTRY_PASSWORD — registry login password or access token
