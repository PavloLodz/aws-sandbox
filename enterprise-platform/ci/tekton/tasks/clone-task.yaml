# ci/tekton/tasks/clone-task.yaml
#
# Implements R7.5: reusable Tekton Task that shallow-clones a Git repository
# into the shared 'source' workspace for use by downstream Tasks in a Pipeline.
#
# Apply with:
#   kubectl apply -f ci/tekton/tasks/clone-task.yaml

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone
spec:
  params:
    - name: url
      type: string
      description: Git repository URL to clone (HTTPS or SSH)
    - name: revision
      type: string
      description: Branch, tag, or commit SHA to clone
      default: main

  workspaces:
    - name: source
      description: >
        Shared workspace where the cloned repository is written.
        All downstream Tasks in the Pipeline must bind the same workspace
        to access the source tree.

  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        git clone --depth=1 --branch=$(params.revision) \
          $(params.url) $(workspaces.source.path)
        # --depth=1 shallow clone: fetches only the latest commit on the
        # requested branch. Reduces clone time from ~30 s to ~3 s and avoids
        # transferring full history that CI builds do not need.
