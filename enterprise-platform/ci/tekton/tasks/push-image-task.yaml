# ci/tekton/tasks/push-image-task.yaml
#
# Implements R7.5: reusable Tekton Task that pushes a pre-built container image
# to the registry. Exists as a separate Task from build-image-task to allow
# pipelines to insert an approval gate between the build and push phases —
# a human reviewer can sign off on the built image before it enters the shared
# registry. Pipelines that do not require a gate can chain build-image-task
# and push-image-task without any intervening manual step.
#
# Apply with:
#   kubectl apply -f ci/tekton/tasks/push-image-task.yaml

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-image
spec:
  params:
    - name: image
      type: string
      description: >
        Registry and repository path for the image, without tag
        (e.g. registry.example.com/myapp).
    - name: tag
      type: string
      description: >
        Image tag to push (e.g. the 7-char commit SHA).

  workspaces:
    - name: dockerconfig
      description: >
        Kubernetes Secret containing a .dockerconfigjson entry with credentials
        for the target registry. Mounted as a volume — credentials never appear
        as environment variable strings in the Task definition (R7.9).
        Bind the same Secret used by build-image-task in the PipelineRun.

  steps:
    - name: push
      image: gcr.io/kaniko-project/executor:latest
      # Kaniko executor in push-only mode: --dockerfile=/dev/null skips any
      # build step; --no-push=false explicitly enables the push operation.
      # No 'privileged: true' is required — safe on OpenShift SCCs and
      # Kubernetes PodSecurityAdmission restricted policies (same rationale
      # as build-image-task).
      args:
        - --dockerfile=/dev/null
        - --no-push=false
        - --destination=$(params.image):$(params.tag)
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
          # Points Kaniko at the mounted Secret for registry authentication
          # without exposing any credential string in the Task definition (R7.9).
