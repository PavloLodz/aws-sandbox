spring.application.name=aws-attempt
server.port=8080

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Graceful shutdown - wait up to 30s for in-flight requests to complete
# before the server stops accepting new ones. Kubernetes sends SIGTERM and
# then waits for terminationGracePeriodSeconds before SIGKILL.
# This timeout must be shorter than terminationGracePeriodSeconds in the
# Kubernetes Deployment (set that to 60s to give a safe buffer).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator - expose health, liveness and readiness for load balancers,
# AWS ALB / Elastic Beanstalk health checks, and Kubernetes probes.
# liveness  -> /actuator/health/liveness  (is the JVM alive?)
# readiness -> /actuator/health/readiness (is the app ready to serve traffic?)
# During graceful shutdown Spring automatically sets readiness to OUT_OF_SERVICE
# so the load balancer stops routing new requests before the JVM exits.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Springdoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
