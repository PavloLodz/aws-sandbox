# Azure profile — env vars injected by Azure Container Apps
spring.datasource.url=jdbc:postgresql://${NEON_HOST}:5432/${NEON_DB}?sslmode=require
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.flyway.enabled=true
