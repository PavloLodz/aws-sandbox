---
# Deploys the Spring Boot JAR and manages the systemd service.

- name: Create app group
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present

- name: Create app user (no login shell)
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"

- name: Download JAR from S3
  # The EC2 IAM role grants s3:GetObject — no credentials needed.
  ansible.builtin.command: >
    aws s3 cp s3://{{ s3_bucket }}/releases/{{ app_name }}.jar
    {{ app_dir }}/{{ app_name }}.jar
    --region {{ s3_region }}
  changed_when: true

- name: Set JAR ownership
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ app_name }}.jar"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"

- name: Install systemd service unit
  ansible.builtin.template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and restart app

- name: Enable and start application service
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    enabled: true
    state: started

- name: Wait for application to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/actuator/health"
    return_content: true
    status_code: 200
  register: health
  retries: 12
  delay: 10
  until: health.status == 200

- name: Show health check result
  ansible.builtin.debug:
    msg: "{{ health.content }}"
